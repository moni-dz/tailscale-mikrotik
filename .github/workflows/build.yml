name: Build and push image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - build.sh
      - tailscale.sh
      - sshd_config
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version vars from build.sh
        id: vars
        run: |
          TAILSCALE_VERSION=$(grep -oP '^TAILSCALE_VERSION=\K.*' build.sh)
          VERSION=$(grep -oP '^VERSION=\K.*' build.sh)
          echo "TAILSCALE_VERSION=$TAILSCALE_VERSION" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Clone tailscale source
        run: git -c advice.detachedHead=false clone --depth 1 https://github.com/tailscale/tailscale.git --branch "v$TAILSCALE_VERSION"

      - name: Compute build stamps
        working-directory: tailscale
        run: |
          export TS_USE_TOOLCHAIN=Y
          eval "$(./build_dist.sh shellvars)"
          echo "VERSION_LONG=$VERSION_LONG" >> "$GITHUB_ENV"
          echo "VERSION_SHORT=$VERSION_SHORT" >> "$GITHUB_ENV"
          echo "VERSION_GIT_HASH=$VERSION_GIT_HASH" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            TAILSCALE_VERSION=${{ env.TAILSCALE_VERSION }}
            VERSION_LONG=${{ env.VERSION_LONG }}
            VERSION_SHORT=${{ env.VERSION_SHORT }}
            VERSION_GIT_HASH=${{ env.VERSION_GIT_HASH }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}:latest
